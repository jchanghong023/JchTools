# cargo-affected 采集依赖本版本提供的 NEXTEST_BINARY_ID。
nextest-version = "0.9.116"

[test-groups]
engine-session = { max-threads = 1 }

[profile.default]
# Desktop tests require explicit authorization via --ignore-default-filter.
default-filter = 'not (binary(/^gui_flow$/) or (binary(/^acp_service_process$/) and (test(=gui::real_gui_save_close_kill_reopen_and_confirmed_service_exit) or test(=gui::real_gui_pending_configuration_applies_only_after_inflight_completion))))'
test-threads = 'num-cpus'
retries = 0
fail-fast = { max-fail = 1, terminate = "immediate" }

# These integration targets and the worker use the same physical engine session.
# Nextest validates each matcher against all workspace targets, even for -p/--lib.
# The worker is a workspace member although it is excluded from default-members.
[[profile.default.overrides]]
filter = '((kind(test) and binary(/^(background_settings|engine_cleanup_filter|jchocr|markdown_convert_gate|markdown_media_e2e|xberg_legacy_protocol|xberg_shared_process|xberg_unknown_response)$/)) or binary_id(/^snap-ocr-worker(::|$)/))'
test-group = 'engine-session'

