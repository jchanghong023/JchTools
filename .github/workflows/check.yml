name: Windows build and package
# 2026-10-08 用户确认：本地 Windows 测试负责验收，CI 仅编译、打包及发布。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build installer and portable ZIP (local tests are authoritative)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/package-windows.ps1 -SkipTests
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JchTools-Windows-x64
          path: |
            dist/*.zip
            dist/JchTools-Setup-x64.exe
          if-no-files-found: error
