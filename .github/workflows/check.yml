name: Windows build and package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: 4
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipTests
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JchTools-Windows-x64
          path: |
            dist/*.zip
            dist/JchTools-Setup-x64.exe
          if-no-files-found: error
