name: Build and test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # 平台范围按合同 P-07 仅 Windows（2026-09-19 起原 linux-core job 移除，
  # 其承载的检查——no-default-features clippy/test、rustdoc、cargo audit/deny——
  # 等量迁入本 job，不得借平台收敛之名少跑检查）。
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # 工具链固定：与 Cargo.toml 的 rust-version 同步更新。
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw 'PowerShell parse failure' }
          }
      # Python 固定 3.13：与 pyproject 的 target-version 及本地验证解释器一致。
      # 3.12 的 typing 无 TypeIs（3.13 起转正），static_check 顶层导入会失效
      #（反证：run 35409549176 windows Python quality gate reportGeneralTypeIssues）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # static_check 的运行时依赖（defusedxml 解析 manifest、pygments 做 rust_lexical）：
      # Windows runner 预装 Python 缺这些包。此前只装 defusedxml 导致 rust_lexical 在
      # CI 被 SKIP（本地装齐则实际执行，覆盖不对称）；按 requirements-dev.txt 整体安装。
      - name: Install Python script dependencies
        shell: pwsh
        run: python -m pip install --quiet -r scripts/requirements-dev.txt
      - name: Static checks
        shell: pwsh
        run: python scripts/static_check.py
      # rustfmt 门禁：与本地 fastcheck/fulltest 同一口径（cargo fmt --all -- --check）。
      - name: Rustfmt check
        shell: pwsh
        run: cargo fmt --all -- --check
      # clippy 零告警硬门禁：默认特性（含 GUI 与 Windows 专属代码）与
      # --no-default-features（无 GUI 核心库）双侧覆盖；任何告警即失败。
      - name: Clippy zero-warning gate (default features)
        shell: pwsh
        run: |
          # 本步是 CI 对默认特性的首次冷编译：Slint 布局绑定环警告由 build script
          # 输出，-D warnings 管不住它，须显式扫描编译日志（与 acceptance.ps1 /
          # fastcheck 同口径；增量缓存不重放旧警告，故挂在首个冷编译步骤上）。
          $log = Join-Path $env:RUNNER_TEMP 'clippy-default.log'
          cargo clippy --all-targets -- -D warnings *> $log
          Get-Content -LiteralPath $log
          if ($LASTEXITCODE -ne 0) { throw "clippy (default features) failed: $LASTEXITCODE" }
          $hits = @(Select-String -LiteralPath $log -Pattern 'binding loop' -SimpleMatch)
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object {"$($_.LineNumber): $($_.Line)"} | Write-Host
            throw '构建输出出现 binding loop 警告（AGENTS 第 4 节禁止）'
          }
      - name: Clippy zero-warning gate (no default features)
        shell: pwsh
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Core tests (no default features)
        shell: pwsh
        run: cargo test --all-targets --no-default-features
      # rustdoc 零告警门禁：与本地质量门同一规则（RUSTDOCFLAGS=-D warnings）。
      - name: Rustdoc zero-warning gate
        shell: pwsh
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Python 质量门（与本地同一命令；规则固定于 pyproject.toml）。
      # Bandit 的 B404/B603 为经逐点核实的固定角色例外：全部 subprocess 命中点均为
      # 固定 argv、无 shell、可执行文件经 which()/绝对路径解析（bash/git/7z/被测产品）。
      - name: Python quality gate
        shell: pwsh
        run: |
          python -m pip install --quiet -r scripts/requirements-dev.txt -r scripts/requirements-quality.txt
          python -m ruff format --check scripts typings
          python -m ruff check scripts typings
          python -m basedpyright scripts typings
          python -m vulture scripts typings --min-confidence 100
          python -m bandit -r scripts -s B404,B603 -q
          # pip-audit 包名的模块形式是下划线 pip_audit（连字符名只是 console script）。
          python -m pip_audit -r scripts/requirements-dev.txt
      # 供应链门禁：按 Cargo.lock 锁定的解析结果对照 RustSec advisory DB 与来源白名单。
      - name: Install cargo-audit and cargo-deny
        shell: pwsh
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: cargo audit
        shell: pwsh
        run: cargo audit
      - name: cargo deny
        shell: pwsh
        run: cargo deny check advisories sources
      - name: Compile, run fixture tests, bundle the full 7-Zip engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/package-windows.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JchTools-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
