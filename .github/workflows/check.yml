name: Build and test
# 触发策略：仅 workflow_dispatch（手动）。
# 本工作流是 slowtest 的远程阶段：由 `python scripts/test_gate.py slowtest --authorized`
# 经 gh workflow run 触发，或由人类明确要求时手动触发；push / pull_request 不再自动触发，
# 避免在人类未明确要求时消耗流水线资源。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # 平台范围按合同 P-07 仅 Windows（2026-09-19 起原 linux-core job 移除，
  # 其承载的检查——no-default-features clippy/test、rustdoc、cargo audit/deny——
  # 等量迁入本 job，不得借平台收敛之名少跑检查）。
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # 工具链固定：与 Cargo.toml 的 rust-version 同步更新。
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw 'PowerShell parse failure' }
          }
      # Python 固定 3.13：与 pyproject 的 target-version 及本地验证解释器一致。
      # 3.12 的 typing 无 TypeIs（3.13 起转正），static_check 顶层导入会失效
      #（反证：run 35409549176 windows Python quality gate reportGeneralTypeIssues）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # static_check 的运行时依赖（defusedxml 解析 manifest、pygments 做 rust_lexical）：
      # Windows runner 预装 Python 缺这些包。此前只装 defusedxml 导致 rust_lexical 在
      # CI 被 SKIP（本地装齐则实际执行，覆盖不对称）；按 requirements-dev.txt 整体安装。
      - name: Install Python script dependencies
        shell: pwsh
        run: python -m pip install --quiet -r scripts/requirements-dev.txt
      # F26：转 Markdown 验收入口默认执行；CI 未提供真实 Xberg/GUI 时必须如实为
      # NOT RUN，不把缺资产环境伪报为通过。提供资产与被测物时由同一入口执行实际条目。
      # S11-04：本步绿灯≠验收覆盖——runner 无真实 Xberg 引擎与已校验模型资产缓存、
      # 无可交互桌面会话（pywinauto 冒烟与 worker-root 服务测试无法在 CI 承载，也不
      # 为凑覆盖而添加 CI 无法承载的阶段）。退出码 2（全部 NOT RUN）保持不失败，但
      # NOT RUN 逐项明细与缺口原因经 --json 报告写入 GITHUB_STEP_SUMMARY，step 名
      # 同时标注，缺口对人类可见；部分 NOT RUN（退出码 0）同样入 Summary。
      - name: Markdown acceptance entry (含 NOT RUN 时见 Step Summary)
        shell: pwsh
        run: |
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE '.tmp'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          $jsonReport = Join-Path $reportDirectory 'markdown-acceptance-report.json'
          python scripts/markdown_acceptance.py --json $jsonReport
          $code = $LASTEXITCODE
          $notRun = @()
          $countsLine = ''
          if (Test-Path -LiteralPath $jsonReport) {
            $report = Get-Content -LiteralPath $jsonReport -Raw -Encoding UTF8 | ConvertFrom-Json
            $notRun = @($report.items | Where-Object { $_.status -eq 'NOT RUN' } |
              ForEach-Object { "- $($_.id) $($_.title)：$($_.reason)" })
            $countsLine = "PASS $($report.summary.pass)| FAIL $($report.summary.fail)| NOT RUN $($report.summary.not_run)（共 $($report.items.Count) 条）"
          }
          if (($code -eq 2) -or (($code -eq 0) -and ($notRun.Count -gt 0))) {
            $summary = $env:GITHUB_STEP_SUMMARY
            if ($summary) {
              $lines = @(
                '### Markdown acceptance：含 NOT RUN（本步绿灯≠验收覆盖）',
                "退出码 $code；$countsLine；缺口原因见下（完整逐项状态见本步骤日志）："
              ) + $notRun
              $lines | Add-Content -LiteralPath $summary -Encoding UTF8
            }
            Write-Host "Markdown acceptance: 含 NOT RUN（$($notRun.Count) 条），详见 Step Summary 与 $jsonReport"
            if ($code -eq 2) { exit 0 }
          }
          if ($code -ne 0) { throw "Markdown acceptance failed: $code" }
      - name: Markdown acceptance postcondition unit tests
        shell: pwsh
        run: python -m unittest scripts.test_markdown_acceptance scripts.test_gui_smoke scripts.test_test_gate
      - name: Static checks
        shell: pwsh
        run: python scripts/static_check.py
      # rustfmt 门禁：与本地 fastcheck/fulltest 同一口径（cargo fmt --all -- --check）。
      - name: Rustfmt check
        shell: pwsh
        run: cargo fmt --all -- --check
      # clippy 零告警硬门禁：默认特性（含 GUI 与 Windows 专属代码）与
      # --no-default-features（无 GUI 核心库）双侧覆盖；任何告警即失败。
      # C-08/附录 B 的 7z/RAR 签名正例通过已校验官方引擎解析结构。
      # 不可用时产品按 E-05 拒绝猜测，因此须在首次编译/核心回归之前准备，
      # 不能等最后的 package-windows.ps1 才下载；测试断言与矩阵保持不变。
      - name: Prepare verified 7-Zip for signature and archive tests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-7zip.ps1
      - name: Clippy zero-warning gate (default features)
        shell: pwsh
        run: |
          # 本步是 CI 对默认特性的首次冷编译：Slint 布局绑定环警告由 build script
          # 输出，-D warnings 管不住它，须显式扫描编译日志（与 acceptance.ps1 /
          # fastcheck 同口径；增量缓存不重放旧警告，故挂在首个冷编译步骤上）。
          $log = Join-Path $env:RUNNER_TEMP 'clippy-default.log'
          cargo clippy --all-targets --features test-hooks -- -D warnings *> $log
          Get-Content -LiteralPath $log
          if ($LASTEXITCODE -ne 0) { throw "clippy (default features) failed: $LASTEXITCODE" }
          $hits = @(Select-String -LiteralPath $log -Pattern 'binding loop' -SimpleMatch)
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object {"$($_.LineNumber): $($_.Line)"} | Write-Host
            throw '构建输出出现 binding loop 警告（AGENTS 第 4 节禁止）'
          }
      - name: Clippy zero-warning gate (no default features)
        shell: pwsh
        run: cargo clippy --all-targets --no-default-features --features test-hooks -- -D warnings
      - name: Core tests (no default features)
        shell: pwsh
        run: cargo test --all-targets --no-default-features --features test-hooks
      # F23/XB-12：旧 markdown-media-worker 已随媒体转录迁移到 Xberg 推理组件退役。
      # 截图 OCR 纯逻辑核心与 worker（workspace 成员）显式门——可选分发不等于可选验证。
      - name: Snap OCR core tests (optional/snap-ocr-core)
        shell: pwsh
        run: cargo test --manifest-path optional/snap-ocr-core/Cargo.toml --all-targets --features test-hooks
      - name: Snap OCR core clippy (optional/snap-ocr-core)
        shell: pwsh
        run: cargo clippy --manifest-path optional/snap-ocr-core/Cargo.toml --all-targets --features test-hooks -- -D warnings
      - name: Snap OCR worker tests (optional/snap-ocr-worker)
        shell: pwsh
        run: cargo test --manifest-path optional/snap-ocr-worker/Cargo.toml --all-targets --features test-hooks
      - name: Snap OCR worker clippy (optional/snap-ocr-worker)
        shell: pwsh
        run: cargo clippy --manifest-path optional/snap-ocr-worker/Cargo.toml --all-targets --features test-hooks -- -D warnings
      # rustdoc 零告警门禁：与本地质量门同一规则（RUSTDOCFLAGS=-D warnings）。
      - name: Rustdoc zero-warning gate
        shell: pwsh
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Python 质量门（与本地同一命令；规则固定于 pyproject.toml）。
      # Bandit 的 B404/B603 为经逐点核实的固定角色例外：全部 subprocess 命中点均为
      # 固定 argv、无 shell、可执行文件经 which()/绝对路径解析（bash/git/7z/被测产品）。
      # F24：pwsh run 块以末条命令退出码为步骤结论，多工具同块时前序失败会被末条
      # 成功掩盖，故一工具一步（命令内容与顺序不变）。
      - name: Install Python quality gate dependencies
        shell: pwsh
        run: python -m pip install --quiet -r scripts/requirements-dev.txt -r scripts/requirements-quality.txt
      - name: Python quality gate (ruff format --check)
        shell: pwsh
        run: python -m ruff format --check scripts typings
      - name: Python quality gate (ruff check)
        shell: pwsh
        run: python -m ruff check scripts typings
      - name: Python quality gate (basedpyright)
        shell: pwsh
        run: python -m basedpyright scripts typings
      - name: Python quality gate (vulture)
        shell: pwsh
        run: python -m vulture scripts typings --min-confidence 100
      - name: Python quality gate (bandit)
        shell: pwsh
        run: python -m bandit -r scripts -s B404,B603 -q
      # pip-audit 包名的模块形式是下划线 pip_audit（连字符名只是 console script）。
      - name: Python quality gate (pip-audit)
        shell: pwsh
        run: python -m pip_audit -r scripts/requirements-dev.txt
      # 供应链门禁：按 Cargo.lock 锁定的解析结果对照 RustSec advisory DB 与来源白名单。
      # F24：两条 cargo install 同块时前一条失败会被后一条成功掩盖，拆成独立 step。
      - name: Install cargo-audit
        shell: pwsh
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Install cargo-deny
        shell: pwsh
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo audit
        shell: pwsh
        run: cargo audit
      - name: cargo deny
        shell: pwsh
        run: cargo deny check advisories sources
      - name: Compile, run fixture tests, bundle the full 7-Zip engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/package-windows.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JchTools-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
