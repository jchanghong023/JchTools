# ~keep Every exclude below is ANCHORED with a leading slash. An unanchored glob matches a
# directory of that name at ANY depth, so a bare `diagrams/**` also hid scripts/corpus_tools/diagrams
# and poly silently stopped linting it. `poly doctor` reports this; it is worth running after adding
# a package whose name collides with a corpus directory.
#
# This repo is a fixture corpus, not a codebase: every top-level directory except `scripts/` holds
# documents that exist precisely because of their exact bytes — malformed XML, legacy encodings,
# deliberate typos, hand-authored whitespace. Reformatting them destroys what they test, so poly is
# scoped to the publisher sources and the root prose docs.
#
# `corpus.lock.json` is generated by `scripts/publish_corpus.py` and its bytes are load-bearing:
# consumers hash it to key the fetch cache, so a formatter touching it invalidates every cache and
# changes what the manifest pins.

[discovery]
exclude = [
  "/archives/**",
  "/audio/**",
  "/bibtex/**",
  "/charts/**",
  "/code/**",
  "/corpus.lock.json",
  "/csv/**",
  "/data_formats/**",
  "/dbf/**",
  "/diagrams/**",
  "/doc/**",
  "/docbook/**",
  "/docx/**",
  "/email/**",
  "/epub/**",
  "/fictionbook/**",
  "/ground_truth/**",
  "/html/**",
  "/hwp/**",
  "/hwpx/**",
  "/images/**",
  "/images_extra/**",
  "/iwork/**",
  "/jats/**",
  "/json/**",
  "/jsonl/**",
  "/jupyter/**",
  "/latex/**",
  "/markdown/**",
  "/markup/**",
  "/odp/**",
  "/odt/**",
  "/office/**",
  "/opml/**",
  "/org/**",
  "/pdf/**",
  "/pdf_scanned/**",
  "/ppt/**",
  "/pptx/**",
  "/MATH_PROVENANCE.md",
  "/REGRESSION_PROVENANCE.md",
  "/rst/**",
  "/rtf/**",
  "/semantic/**",
  "/test_fixtures/**",
  "/text/**",
  "/text_splitter/**",
  "/typst/**",
  "/user_reports/**",
  "/vendored/**",
  "/wordperfect/**",
  "/xls/**",
  "/xlsx/**",
  "/xml/**",
  "/yaml/**",
]

# ~keep Matches the polyrepo root's list. .ai-rulez/ authors agents and rules as front-matter plus
# prose, so MD041 (first line must be an H1) is wrong for them by construction.
[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

# ~keep poly does NOT read pyproject.toml's [tool.ruff]; it runs ruff with the config below.
# Verified: a file with `from __future__ import annotations` is clean to `poly lint` and a TID251
# error to `uv run ruff check`. So the two must be kept in step, and
# scripts/tests/test_lint_scope.py asserts that they are.
#
# ~keep pyproject.toml keeps its own [tool.ruff] rather than deferring entirely to this file,
# because that is what constrains a HUMAN running `ruff format .` or an editor-on-save — neither of
# which reads poly.toml. Its force-exclude is the corpus protection; the [discovery] exclude above
# is the same protection for poly's own runs. Two tools, two configs, one corpus.
[lint.python.ruff]
pydocstyle_convention = "google"
mccabe_max_complexity = 15
pylint_max_args = 10
pylint_max_branches = 15
pylint_max_returns = 10
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY",
  "D100",
  "D104",
  "D107",
  "D203",
  "D205",
  "D212",
  "E501",
  "EM",
  "FBT",
  "FIX",
  "ISC001",
  "N818",
  "PGH003",
  "TC003",
  "PLR2004",
  "S104",
  "S110",
  "S603",
  "TD",
  "TRY",
]

# ~keep The polyrepo type-checks with pyrefly, run through poly rather than installed as a dev
# dependency — it is a system tool like poly itself. Scoped to the tooling and away from the tests
# for the reason given beside [tool.pyrefly] in pyproject.toml.
[hooks.pre-commit.commands.pyrefly]
run = "pyrefly check"
files = "scripts/**/*.py"
exclude = ["scripts/tests/**"]
workspace = true
cache = { inputs = ["scripts/**/*.py", "pyproject.toml"] }

[per-file-ignores]
"LICENSES.md" = ["MD075"]

# ~keep Mirrors [tool.ruff.lint.per-file-ignores] in pyproject.toml, for the reason recorded
# beside [lint.python.ruff] above: poly does not read that file.
"scripts/*.py" = ["D101", "D102", "D103", "EXE001", "INP001", "PLW1510", "S607", "T201"]
"scripts/corpus_tools/**" = ["D101", "D102", "D103", "PLC0415", "PLW1510", "S607", "SIM105", "T201"]
"scripts/tests/**" = ["ANN", "ARG002", "D", "INP001", "PLC2701", "PLR2004", "PT009", "PT027", "S", "SLF001"]
"scripts/tests/test_http.py" = ["ANN", "D", "PLR2004", "PT009", "S", "SLF001"]
