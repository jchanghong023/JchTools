name: Verify Corpus

# ~keep This repo cannot publish from CI: the corpus binaries are not in git, so a checkout contains
# nothing to upload. Publishing is a local maintainer action (`python3 scripts/publish_corpus.py
# --bucket xberg-test-documents`) that commits a refreshed corpus.lock.json. What CI can do — and
# what actually protects consumers — is prove that every object the lock file pins is still
# fetchable from the public bucket. That needs no credentials at all.

# ~keep The job below runs the runner's bare `python3` with no setup-python and no install step,
# and it must stay that way. That is not an oversight: it is the executable proof that a consumer
# with nothing but a stock interpreter can resolve this corpus. Adding `uv sync`, a dependency, or
# even setup-python would make the job pass for reasons a consumer does not have. The unit tests
# moved to test-unit.yml, which is allowed to install things.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Manifest resolves from the bucket
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: xberg-test-documents
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify every pinned object is present with the pinned size
        run: python3 scripts/verify_corpus.py --bucket "$BUCKET_NAME"

      - name: Verify a sample downloads and hashes correctly
        run: python3 scripts/verify_corpus.py --bucket "$BUCKET_NAME" --sample 20
