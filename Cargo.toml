[package]
name = "jchtools"
version = "0.1.0"
edition = "2021"
# 最低支持工具链（MSRV）：CI 用 dtolnay/rust-toolchain@1.98.1 固定精确版本，
# 与本字段同步更新；本仓库不固定本地工具链，由 Cargo rust-version 拒绝过旧工具链。
rust-version = "1.98.1"
license = "MIT"
description = "Windows-first extensible local toolbox and directory organizer"
repository = "https://github.com/jchanghong023/JchTools"
keywords = ["toolbox", "windows", "file-manager", "organizer"]
categories = ["command-line-utilities", "gui", "filesystem"]
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:open"]
# 性能耗时打点（默认关闭，长期保留）：诊断日志（P-10，src/logging.rs）使 tracing
# 依赖常开，本特性只控制性能打点代码与 perf-logs 层是否参与编译。
# 启用方式：cargo run --features perf-tracing（日志落状态目录下的 perf-logs/，见 src/perf.rs）。
perf-tracing = []
# 仅隔离测试使用：允许测试目录/代理入口覆盖。发布与普通启动不启用。
test-hooks = []

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories-next = "2.0"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
flate2 = "1.1"
infer = "0.19"
lopdf = { version = "=0.45.0", default-features = false }
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# socks-proxy：Windows 系统代理的 socks= 条目（P-09）需要 ureq 的 SOCKS 支持。
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "socks-proxy"] }
# 供 C-08 文件名 NFC 规范化使用。
unicode-normalization = "0.1"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
slint = { version = "=1.17.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
rfd = { version = "0.15", optional = true }
open = { version = "5.3", optional = true }
# 诊断日志（P-10）与性能打点共用 tracing 基建；性能打点代码仍由 perf-tracing 特性门控。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }
flate2 = "1.1"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.19"
filetime = "0.2"
i-slint-backend-testing = "=1.17.1"
proptest = "1.11.0"
# 仅测试用：编译 ui/app.slint 做零诊断门禁（不进产品二进制）
slint-interpreter = "=1.17.1"
spin_on = "0.1"

[[bin]]
name = "JchTools"
path = "src/main.rs"
required-features = ["gui"]

# 此集成测试启动真实主程序的内部代理入口；该二进制本身要求 gui。
[[test]]
name = "xberg_shared_process"
path = "tests/xberg_shared_process.rs"
required-features = ["gui", "test-hooks"]

# 真实后台代理入口依赖 GUI 二进制，测试用合成引擎验证生命周期。
[[test]]
name = "background_settings"
path = "tests/background_settings.rs"
required-features = ["gui", "test-hooks"]

# 旧协议必须明确拒绝未声明共享能力的推理；仅隔离测试可拉起合成引擎。
[[test]]
name = "xberg_legacy_protocol"
path = "tests/xberg_legacy_protocol.rs"
required-features = ["gui", "test-hooks"]

[[test]]
name = "xberg_settings"
path = "tests/xberg_settings.rs"
required-features = ["test-hooks"]

[[test]]
name = "markdown_convert_gate"
path = "tests/markdown_convert_gate.rs"
required-features = ["test-hooks"]

[[test]]
name = "markdown_media_e2e"
path = "tests/markdown_media_e2e.rs"
required-features = ["test-hooks"]

[workspace]
# F23/XB-12：可选组件纳入 workspace——统一锁文件，使根 cargo audit/deny 覆盖其依赖。
# 旧 markdown-media-worker 已随媒体转录迁移到 Xberg 推理组件退役（XB-12）。
# default-members 保持仅主包：日常 cargo build/test 与打包脚本行为不变；
# 可选组件的测试与 clippy 由 CI（check.yml）与 acceptance.ps1 以 --manifest-path 显式覆盖
#（可选分发不等于可选验证）。
members = ["optional/snap-ocr-core", "optional/snap-ocr-worker"]
default-members = ["."]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# 生产构建同样启用运行期安全检查（release 默认关闭）：
# 本工具移动/删除用户文件，算术溢出与断言失败宁可显式失败也不静默产出错误值。
# 代价是对依赖同样生效的少量性能开销，对本地工具箱值得。
overflow-checks = true
debug-assertions = true

[profile.dev]
debug = 1

# ── lint 硬门禁（2026-09-18 起零告警，预算棘轮已删除）────────────────────────
# 告警存量清零后全部升为硬错误：新增告警本地编译即失败；
# CI 另以 cargo clippy --all-targets -- -D warnings 双侧兜底（默认特性 + --no-default-features）。
[lints.rust]
warnings = "deny"                  # 兜底：任何未归类告警本地编译即失败（CI 另以 -D warnings 双侧兜底）
unsafe_op_in_unsafe_fn = "deny"    # unsafe fn 体内操作必须显式 unsafe 块（edition 2024 默认规则提前转正）
unused_must_use = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unused_variables = "deny"
future_incompatible = { level = "deny", priority = -1 } # 组：未来版本将变硬错误的写法，提前暴露（组需低于单体优先级）
rust_2018_idioms = { level = "deny", priority = -1 }    # 组：idiom 迁移遗留写法（组需低于单体优先级）
explicit_outlives_requirements = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"

[lints.clippy]
# 组级最大化发现面（clippy 默认组 correctness/suspicious/style/complexity/perf 天然开启）：
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# restriction 组中与「文件操作工具中途不得 panic」直接相关的高价值项：
unwrap_used = "deny"               # src/ 内 unwrap 即编译失败（测试 crate 按政策豁免，见各测试文件头）
expect_used = "deny"
dbg_macro = "deny"                 # 调试残留
todo = "deny"                      # 未完成占位不得合入
unimplemented = "deny"             # 未实现占位不得合入
mem_forget = "deny"                # 手工泄漏内存（ManuallyDrop/drop 才是显式选择）
fn_to_numeric_cast_any = "deny"    # 函数指针转整数几乎总是 ABI 错误
undocumented_unsafe_blocks = "deny"        # 每个 unsafe 块必须带真实 SAFETY: 依据
multiple_unsafe_ops_per_block = "deny"     # 多个独立 unsafe 操作不得挤在一个块里
# 豁免：纯排版/文档义务/意见型噪音，与缺陷发现无关（每条附理由）。
doc_markdown = "allow"             # 文档标识符反引号排版
missing_errors_doc = "allow"       # 文档段落义务
missing_panics_doc = "allow"
must_use_candidate = "allow"       # 属性建议，量大且属意见
items_after_statements = "allow"   # 风格偏好
multiple_crate_versions = "allow"  # 传递依赖版本重复（windows/slint 生态，见 quality-gate 证据 cargo-tree-duplicates），非本仓可控 [quality-baseline approved 2026-09-19]
too_many_lines = "allow"           # GUI 装配/引擎主流程函数天然较长，强拆损可读性
struct_excessive_bools = "allow"   # Config/State 的开关集合镜像 JSON 配置与 UI 状态
