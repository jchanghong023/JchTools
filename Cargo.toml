[package]
name = "jchtools"
version = "0.1.0"
edition = "2021"
# 最低支持工具链（MSRV）：CI 用 dtolnay/rust-toolchain@1.98.1 固定精确版本，
# 两处同步更新；本地不强制固定（rust-toolchain.toml 的在线下载在本机网络下不可靠），
# 靠本下限拒绝过旧的工具链。
rust-version = "1.98.1"
license = "MIT"
description = "Windows-first extensible local toolbox and directory organizer"
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:open"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories-next = "2.0"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
flate2 = "1.1"
infer = "0.19"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"
slint = { version = "=1.17.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
rfd = { version = "0.15", optional = true }
open = { version = "5.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
trash = "5.2"

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }
flate2 = "1.1"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.19"
filetime = "0.2"
i-slint-backend-testing = "=1.17.1"
proptest = "1.11.0"
# 仅测试用：编译 ui/app.slint 做零诊断门禁（不进产品二进制）
slint-interpreter = "=1.17.1"
spin_on = "0.1"

[[bin]]
name = "JchTools"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# 生产构建同样启用运行期安全检查（release 默认关闭）：
# 本工具移动/删除用户文件，算术溢出与断言失败宁可显式失败也不静默产出错误值。
# 代价是对依赖同样生效的少量性能开销，对本地工具箱值得。
overflow-checks = true
debug-assertions = true

[profile.dev]
debug = 1

# ── lint 硬门禁（2026-09-18 起零告警，预算棘轮已删除）────────────────────────
# 告警存量清零后全部升为硬错误：新增告警本地编译即失败；
# CI 另以 cargo clippy --all-targets -- -D warnings 双侧兜底（默认特性 + --no-default-features）。
[lints.rust]
warnings = "deny"                  # 兜底：任何未归类告警本地编译即失败（CI 另以 -D warnings 双侧兜底）
unsafe_op_in_unsafe_fn = "deny"    # unsafe fn 体内操作必须显式 unsafe 块（edition 2024 默认规则提前转正）
unused_must_use = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unused_variables = "deny"
future_incompatible = { level = "deny", priority = -1 } # 组：未来版本将变硬错误的写法，提前暴露（组需低于单体优先级）
rust_2018_idioms = { level = "deny", priority = -1 }    # 组：idiom 迁移遗留写法（组需低于单体优先级）
explicit_outlives_requirements = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"

[lints.clippy]
# 组级最大化发现面（clippy 默认组 correctness/suspicious/style/complexity/perf 天然开启）：
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# restriction 组中与「文件操作工具中途不得 panic」直接相关的高价值项：
unwrap_used = "deny"               # src/ 内 unwrap 即编译失败（测试 crate 按政策豁免，见各测试文件头）
expect_used = "deny"
dbg_macro = "deny"                 # 调试残留
todo = "deny"                      # 未完成占位不得合入
unimplemented = "deny"             # 未实现占位不得合入
mem_forget = "deny"                # 手工泄漏内存（ManuallyDrop/drop 才是显式选择）
fn_to_numeric_cast_any = "deny"    # 函数指针转整数几乎总是 ABI 错误
undocumented_unsafe_blocks = "deny"        # 每个 unsafe 块必须带真实 SAFETY: 依据
multiple_unsafe_ops_per_block = "deny"     # 多个独立 unsafe 操作不得挤在一个块里
# 豁免：纯排版/文档义务/意见型噪音，与缺陷发现无关（每条附理由）。
doc_markdown = "allow"             # 文档标识符反引号排版
missing_errors_doc = "allow"       # 文档段落义务
missing_panics_doc = "allow"
must_use_candidate = "allow"       # 属性建议，量大且属意见
items_after_statements = "allow"   # 风格偏好
unreadable_literal = "allow"       # Windows API 标志常量等无分隔符惯用法
cargo_common_metadata = "allow"    # 个人离线工具的 manifest 元数据义务（keywords/repository 等）
multiple_crate_versions = "allow"  # 传递依赖版本重复（windows 生态），非本仓可控
too_many_lines = "allow"           # GUI 装配/引擎主流程函数天然较长，强拆损可读性
struct_excessive_bools = "allow"   # Config/State 的开关集合镜像 JSON 配置与 UI 状态
