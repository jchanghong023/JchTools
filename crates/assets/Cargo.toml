[package]
name = "jchtools-assets"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
build = "build.rs"
description = "Shared inference asset installation and screenshot service assets"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
test-hooks = ["jchtools-foundation/test-hooks", "jchtools-file-core/test-hooks", "jchtools-xberg/test-hooks"]
perf-tracing = ["jchtools-foundation/perf-tracing"]

[dependencies]
jchtools-foundation = { workspace = true }
jchtools-file-core = { workspace = true }
jchtools-xberg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
# 下载专用 TLS verifier 与 ureq 使用同一锁定 rustls/ring 实现，保留握手签名校验。
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
# ureq 3 移除了 request_url() 的 URL 校验/规范化，重定向 Location 拼接改用
# url crate（与 ureq 2 内部同一实现）；P-03 联网文件白名单不受影响（非 HTTP 客户端）。
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
jchtools-xberg = { workspace = true, features = ["test-hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
