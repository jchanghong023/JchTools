[package]
name = "jchtools-assets"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
build = "build.rs"
description = "Shared inference asset installation and screenshot service assets"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
test-hooks = ["jchtools-foundation/test-hooks", "jchtools-file-core/test-hooks", "jchtools-xberg/test-hooks"]
perf-tracing = ["jchtools-foundation/perf-tracing"]

[dependencies]
jchtools-foundation = { workspace = true }
jchtools-file-core = { workspace = true }
jchtools-xberg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
# ureq 3 移除了 request_url() 的 URL 校验/规范化，重定向 Location 拼接改用
# url crate（与 ureq 2 内部同一实现）；P-03 联网文件白名单不受影响（非 HTTP 客户端）。
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
jchtools-xberg = { workspace = true, features = ["test-hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# ureq 3 不再转发 rustls：诊断测试的本地 TLS 服务端直接依赖 rustls
#（与 ureq 3.4.2 依赖的 rustls 0.23 同一副本；ring 提供者与 ureq 的
# rustls feature 并集一致，不引入新加密后端）。
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[lints]
workspace = true
