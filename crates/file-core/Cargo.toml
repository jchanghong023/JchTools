[package]
name = "jchtools-file-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "Core file safety, task storage, scanning and bundled archive engine"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
test-hooks = ["jchtools-foundation/test-hooks"]
perf-tracing = ["jchtools-foundation/perf-tracing"]

[dependencies]
jchtools-foundation = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
lopdf = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
