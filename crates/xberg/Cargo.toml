[package]
name = "jchtools-xberg"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "Shared Xberg broker and inference runtime"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# 隔离测试覆盖必须在读取状态目录的真实 foundation 依赖中一并启用。
test-hooks = ["jchtools-foundation/test-hooks"]

[dependencies]
jchtools-foundation = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
fs2 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
