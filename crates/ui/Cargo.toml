[package]
name = "jchtools-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "Generated Slint interface for JchTools"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build"]
# 仅供根包 mcp-server 调试构建：编译期向生成的 UI 代码注入元素调试信息，
# 供内嵌 Slint MCP 服务器的元素树查询与交互使用（见根目录 e2e.md）。
mcp-debug-info = ["gui"]

[dependencies]
slint = { workspace = true, optional = true }

[build-dependencies]
slint-build = { workspace = true, optional = true }

[lints]
workspace = true
