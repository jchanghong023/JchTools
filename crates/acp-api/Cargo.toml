[package]
name = "jchtools-acp-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
description = "ACP agent service, HTTP boundary and background runtime"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-hooks = ["jchtools-foundation/test-hooks", "tokio/io-std"]

[dependencies]
jchtools-foundation = { workspace = true }
agent-client-protocol = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
sha2 = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
