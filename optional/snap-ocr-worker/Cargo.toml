[package]
name = "snap-ocr-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
# 仅隔离测试显式启用；发布的后台程序不能读取测试路径覆盖。
test-hooks = ["jchtools-foundation/test-hooks", "jchtools-xberg/test-hooks"]

[lib]
name = "snap_ocr_worker"

[[bin]]
name = "snap-ocr-worker"
path = "src/main.rs"

[dependencies]
jchtools-foundation = { workspace = true }
jchtools-xberg = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# 结果窗（O-21）：与主程序同版本 Slint；worker 是可选资产，不进主 EXE。
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-fontique-011", "raw-window-handle-06"] }
serde_json = "1"
# 命名管道身份哈希（service/protocol）仍需 SHA-256；推理资产校验已随内嵌推理一并移除。
sha2 = "0.11"
hex = "0.4"
raw-window-handle = "0.6"
# 截图字节经内存 PNG 编码后以 base64 传给本地 xberg 子进程（O-29：不落盘）。
base64 = "0.23"
# P-10：服务自己的 tracing 埋点共用 foundation 诊断日志；runtime 由真实依赖提供。
tracing = { workspace = true }

[dev-dependencies]
jchtools-foundation = { workspace = true, features = ["test-hooks"] }
tracing-subscriber = { workspace = true }
tempfile = "3.19"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
# 服务/托盘/热键/管道/截图/自启动所需（模块头注有各 feature 归属；集成期裁剪）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 与主包/ snap-ocr-core 同口径的零告警硬门禁（workspace lints 不自动继承到成员，
# 需独立声明）；2026-10-03 质量门复检补齐此前缺失的 rust 组与 restriction 项。
[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unused_variables = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
explicit_outlives_requirements = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
