[package]
name = "snap-ocr-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = []
# 仅隔离测试显式启用；发布的后台程序不能读取测试路径覆盖。
test-hooks = []

[lib]
name = "snap_ocr_worker"

[[bin]]
name = "snap-ocr-worker"
path = "src/main.rs"

[dependencies]
directories-next = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# 结果窗（O-21）：与主程序同版本 Slint；worker 是可选资产，不进主 EXE。
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-fontique-010", "raw-window-handle-06"] }
serde_json = "1"
# 命名管道身份哈希（service/protocol）仍需 SHA-256；推理资产校验已随内嵌推理一并移除。
sha2 = "0.10"
raw-window-handle = "0.6"
# 截图字节经内存 PNG 编码后以 base64 传给本地 xberg 子进程（O-29：不落盘）。
base64 = "0.22"
# P-10：代理分支复用主包诊断日志；共享 runtime 模块内含 tracing 埋点。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.19"
i-slint-backend-testing = { version = "=1.17.1", features = ["renderer-software"] }

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
# 服务/托盘/热键/管道/截图/自启动所需（模块头注有各 feature 归属；集成期裁剪）。
# System_IO 供共享运行时 Windows 代理（#[path] 编入的 src/xberg_runtime_windows.rs）
# 的 CancelSynchronousIo 与带 OVERLAPPED 的 ConnectNamedPipe；JobObjects 供代理
# 进程的 kill-on-close 兜底。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 与主包/ snap-ocr-core 同口径的零告警硬门禁（workspace lints 不自动继承到成员，
# 需独立声明）；2026-10-03 质量门复检补齐此前缺失的 rust 组与 restriction 项。
[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unused_variables = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
explicit_outlives_requirements = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
# 共享模块 logging.rs 按 perf-tracing 特性合并性能层；本 crate 不设该特性，
# 只声明其取值合法，避免 unexpected_cfgs 报错（层在该 crate 恒为 absent）。
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("perf-tracing"))'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
