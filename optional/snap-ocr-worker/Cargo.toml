[package]
name = "snap-ocr-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "snap_ocr_worker"

[[bin]]
name = "snap-ocr-worker"
path = "src/main.rs"

[[test]]
name = "det_paddlex_oracle"
path = "src/det_paddlex_tests.rs"

[[test]]
name = "pipeline_backend_oracle"
path = "src/pipeline_backend_tests.rs"

[dependencies]
snap-ocr-core = { path = "../snap-ocr-core" }
xberg-paddle-ocr = { path = "vendor/xberg-paddle-ocr", features = ["load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 结果窗（O-21）：与主程序同版本 Slint；worker 是可选资产，不进主 EXE。
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-fontique-010", "raw-window-handle-06"] }
serde_json = "1"
sha2 = "0.10"
raw-window-handle = "0.6"
# det/rec 适配层直接依赖：vendored crate 的 inference 为 pub(crate)，且需要
# 原生 Clipper（与 pyclipper 同源 6.4.2）与 load-dynamic 的 ort 会话。
geo-clipper = "0.9"
geo-types = "0.7"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-18", "load-dynamic"] }

[dev-dependencies]
tempfile = "3.19"
i-slint-backend-testing = { version = "=1.17.1", features = ["renderer-software"] }

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
# 服务/托盘/热键/管道/截图/自启动所需（模块头注有各 feature 归属；集成期裁剪）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
