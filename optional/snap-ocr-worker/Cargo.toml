[package]
name = "snap-ocr-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "snap_ocr_worker"

[[bin]]
name = "snap-ocr-worker"
path = "src/main.rs"

# 协议测试的模拟子进程：模拟 `xberg worker` 的 stdout 行为（id 回显/状态/成功/失败/EOF）。
# 仅供 tests/xberg_client.rs 经 CARGO_BIN_EXE_* 引用，不随资产发布。
[[bin]]
name = "mock-xberg-worker"
path = "src/bin/mock-xberg-worker.rs"

[dependencies]
directories-next = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# 结果窗（O-21）：与主程序同版本 Slint；worker 是可选资产，不进主 EXE。
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-fontique-010", "raw-window-handle-06"] }
serde_json = "1"
# 命名管道身份哈希（service/protocol）仍需 SHA-256；推理资产校验已随内嵌推理一并移除。
sha2 = "0.10"
raw-window-handle = "0.6"
# 截图字节经内存 PNG 编码后以 base64 传给本地 xberg 子进程（O-29：不落盘）。
base64 = "0.22"
# P-10：代理分支复用主包诊断日志；共享 runtime 模块内含 tracing 埋点。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.19"
i-slint-backend-testing = { version = "=1.17.1", features = ["renderer-software"] }

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
# 服务/托盘/热键/管道/截图/自启动所需（模块头注有各 feature 归属；集成期裁剪）。
# JobObjects 供推理子进程的 kill-on-close 兜底（xberg_worker::InferenceJob，
# O-16/E2'-1）；System_IO 供写入看门狗的 CancelIoEx（请求写阶段超时取消，
# xberg_worker::WriteWatchdog，XB-08）。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
warnings = "deny"
# 共享模块 logging.rs 按 perf-tracing 特性合并性能层；本 crate 不设该特性，
# 只声明其取值合法，避免 unexpected_cfgs 报错（层在该 crate 恒为 absent）。
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("perf-tracing"))'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
